# PostgreSQL Deployment + Service + ConfigMap (init.sql)
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: studdash
data:
  init.sql: |
    -- Users table
    CREATE TABLE IF NOT EXISTS users (
        id SERIAL PRIMARY KEY,
        username VARCHAR(50) UNIQUE NOT NULL,
        password VARCHAR(255) NOT NULL,
        name VARCHAR(100) NOT NULL,
        email VARCHAR(100) NOT NULL,
        role VARCHAR(20) NOT NULL DEFAULT 'student' CHECK (role IN ('student', 'teacher', 'admin')),
        is_active BOOLEAN NOT NULL DEFAULT true,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS subjects (
        id SERIAL PRIMARY KEY,
        code VARCHAR(20) UNIQUE NOT NULL,
        name VARCHAR(100) NOT NULL,
        credits INTEGER NOT NULL DEFAULT 3
    );

    CREATE TABLE IF NOT EXISTS registrations (
        id SERIAL PRIMARY KEY,
        student_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,
        subject_id INTEGER NOT NULL REFERENCES subjects(id) ON DELETE CASCADE,
        registered_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(student_id, subject_id)
    );

    CREATE TABLE IF NOT EXISTS grades (
        id SERIAL PRIMARY KEY,
        student_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,
        subject_id INTEGER NOT NULL REFERENCES subjects(id) ON DELETE CASCADE,
        grade VARCHAR(5) NOT NULL,
        UNIQUE(student_id, subject_id)
    );

    CREATE TABLE IF NOT EXISTS notes (
        id SERIAL PRIMARY KEY,
        teacher_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,
        title VARCHAR(200) NOT NULL,
        filename VARCHAR(255) NOT NULL,
        filepath VARCHAR(500) NOT NULL,
        uploaded_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS assignments (
        id SERIAL PRIMARY KEY,
        student_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,
        title VARCHAR(200) NOT NULL,
        filename VARCHAR(255) NOT NULL,
        filepath VARCHAR(500) NOT NULL,
        uploaded_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Seed data (pre-computed bcrypt $2a$ hashes, compatible with bcryptjs)
    INSERT INTO users (username, password, name, email, role) VALUES
      ('admin', '$2a$10$cSspWV6mX0sm1TZgV5r/2OXVORkOWl6GiLOC/yP1/GzKyg/omkcVG', 'Administrator', 'admin@studdash.local', 'admin'),
      ('teacher1', '$2a$10$rKqRdLnvXAgAniKu/8pkL.jsCzPggYQEWxrxD20A2BcLBAvLtl.Si', 'Prof. Sarah Wilson', 'sarah@university.edu', 'teacher'),
      ('john', '$2a$10$rKqRdLnvXAgAniKu/8pkL.jsCzPggYQEWxrxD20A2BcLBAvLtl.Si', 'John Doe', 'john@university.edu', 'student'),
      ('jane', '$2a$10$rKqRdLnvXAgAniKu/8pkL.jsCzPggYQEWxrxD20A2BcLBAvLtl.Si', 'Jane Smith', 'jane@university.edu', 'student'),
      ('alex', '$2a$10$rKqRdLnvXAgAniKu/8pkL.jsCzPggYQEWxrxD20A2BcLBAvLtl.Si', 'Alex Johnson', 'alex@university.edu', 'student')
    ON CONFLICT (username) DO NOTHING;

    INSERT INTO subjects (code, name, credits) VALUES
      ('CS101', 'Intro to Computer Science', 3),
      ('CS201', 'Data Structures', 4),
      ('CS301', 'Algorithms', 4),
      ('MATH101', 'Calculus I', 3),
      ('MATH201', 'Linear Algebra', 3),
      ('ENG101', 'English Composition', 2),
      ('PHY101', 'Physics I', 4)
    ON CONFLICT (code) DO NOTHING;

    INSERT INTO registrations (student_id, subject_id) VALUES (3,1),(3,2),(3,4),(3,6) ON CONFLICT DO NOTHING;
    INSERT INTO grades (student_id, subject_id, grade) VALUES (3,1,'A'),(3,2,'B+'),(3,4,'A-'),(3,6,'A') ON CONFLICT DO NOTHING;
    INSERT INTO registrations (student_id, subject_id) VALUES (4,1),(4,3),(4,5) ON CONFLICT DO NOTHING;
    INSERT INTO grades (student_id, subject_id, grade) VALUES (4,1,'B'),(4,3,'A-'),(4,5,'B+') ON CONFLICT DO NOTHING;

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: studdash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: studdash
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: studdash-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: studdash-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-sql
          configMap:
            name: postgres-init

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: studdash
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
