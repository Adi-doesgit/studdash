# Kubernetes Secrets (base64-encoded)
# =============================================
# IMPORTANT: Use echo -n "value" | base64 (no trailing newline!)
# To re-generate:
#   echo -n "studdash_password" | base64  → c3R1ZGRhc2hfcGFzc3dvcmQ=
#   echo -n "studdash" | base64           → c3R1ZGRhc2g=
#   echo -n "supersecret-jwt-key" | base64 → c3VwZXJzZWNyZXQtand0LWtleQ==
# =============================================
apiVersion: v1
kind: Secret
metadata:
  name: studdash-secrets
  namespace: studdash
type: Opaque
data:
  DB_PASSWORD: c3R1ZGRhc2hfcGFzc3dvcmQ=
  DB_USER: c3R1ZGRhc2g=
  DB_NAME: c3R1ZGRhc2g=
  JWT_SECRET: c3VwZXJzZWNyZXQtand0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==
