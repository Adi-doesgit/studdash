# =============================================
# Student Dashboard - Docker Compose
# =============================================
# Run:   docker-compose up --build
# Stop:  docker-compose down
# Reset: docker-compose down -v (deletes data)
# =============================================

services:
  # --- PostgreSQL Database ---
  postgres:
    image: postgres:16-alpine
    container_name: studdash-postgres
    environment:
      POSTGRES_USER: studdash
      POSTGRES_PASSWORD: studdash_password
      POSTGRES_DB: studdash
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - studdash-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studdash"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Backend API ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studdash-backend
    env_file:
      - .env
    secrets:
      - jwt_secret
    volumes:
      - upload-data:/app/uploads
    ports:
      - "5050:5000"
    networks:
      - studdash-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Frontend (Nginx + React) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studdash-frontend
    ports:
      - "3000:80"
    networks:
      - studdash-network
    depends_on:
      - backend
    restart: unless-stopped

  # --- Prometheus (Monitoring) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: studdash-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - studdash-network
    depends_on:
      - backend
    restart: unless-stopped

  # --- Grafana (Dashboard Visualization) ---
  grafana:
    image: grafana/grafana:latest
    container_name: studdash-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3003:3000"
    networks:
      - studdash-network
    depends_on:
      - prometheus
    restart: unless-stopped

# --- Docker Secrets ---
secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt

# --- Named Volumes (Persistent Storage) ---
volumes:
  pg-data:
    driver: local
  upload-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# --- Network ---
networks:
  studdash-network:
    driver: bridge
